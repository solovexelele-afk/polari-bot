<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}POLARI{% endblock %}</title>
<meta name="description" content="POLARI — Discord-сервер с характером. Магазин ролей и проект в CS 2.">
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/site.css">
</head>
<body class="polari">
<header class="topbar">
  <a class="brand" href="/"><span class="flake">❄</span>POLARI</a>
  <nav class="nav">
    <a href="/" class="{{ 'on' if path == '/' }}">Главная</a>
    <a href="/shop" class="{{ 'on' if path.startswith('/shop') }}">Магазин</a>
    <a href="/cs2" class="nav-cs2">Проект в CS 2 <span>→</span></a>
  </nav>
  <div class="account">
    {% if user %}
      <img src="{{ user.avatar|av }}" alt=""><span>{{ user.name }}</span><a href="/logout" class="ghost sm">Выйти</a>
    {% else %}
      <a href="/login?next={{ path }}" class="btn sm">Войти через Discord</a>
    {% endif %}
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<footer class="footer">
  <span>❄ POLARI · {{ members }} участников</span>
  <span>{% if invite %}<a href="{{ invite }}">Discord-сервер</a> · {% endif %}<a href="/cs2">Проект в CS 2</a></span>
</footer>
</body>
</html>
